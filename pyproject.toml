[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagedbatch"
version = "0.1.0"
description = "Minimal continuous-batching LLM inference server with a paged KV cache"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "safetensors>=0.4",
    "tokenizers>=0.15",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.23"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
]

[project.scripts]
pagedbatch = "pagedbatch.__main__:main"

[tool.setuptools]
packages = ["pagedbatch"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E731", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
